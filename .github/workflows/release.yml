name: Release

# Baut bei einem Tag v* (z. B. v0.4.0) die exe und hängt sie an ein GitHub-Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version aus dem Tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Veröffentlichen (Single-File, framework-abhängig)
        shell: pwsh
        run: >
          dotnet publish src/ClaudeTaskMonitor/ClaudeTaskMonitor.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" publish/ClaudeTaskMonitor.exe
          --title "Claude Task Monitor ${{ github.ref_name }}"
          --notes "Benötigt die .NET 10 Desktop Runtime (x64). Einfach ClaudeTaskMonitor.exe starten."
